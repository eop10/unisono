<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#E4E0D8;font-family:-apple-system,sans-serif;padding:28px 32px;}
  h1{font-size:13px;font-weight:600;margin:0 0 16px;color:#16181A}
  .row{display:flex;gap:26px;align-items:center}
  .ph{width:200px;height:200px;border-radius:50%;background:#0E0F10;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .ph img{position:absolute;width:300px;height:300px;left:-50px;top:-50px}
  .sq{width:200px;height:200px;border-radius:44px;background:#0E0F10;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .sq img{position:absolute;width:300px;height:300px;left:-50px;top:-50px}
  .lbl{font:400 9px/1.4 "JetBrains Mono",monospace;color:#6E6A62;margin-top:8px;text-align:center}
  .cell{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<h1>Unisono · adaptive icon (foreground 61% + фон #0E0F10)</h1>
<div class="row">
  <div class="cell"><div class="ph"><img src="../android/foreground-432.png"></div><div class="lbl">круглая маска</div></div>
  <div class="cell"><div class="sq"><img src="../android/foreground-432.png"></div><div class="lbl">squircle</div></div>
  <div class="cell"><div class="ph" style="background:#F3F0EA"><img src="../android/monochrome-432.png" style="filter:invert(1)"></div><div class="lbl">monochrome (инверсия для светлой темы)</div></div>
</div>
</body></html>
