version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
hound = "3.5"
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "pitch"
harness = false