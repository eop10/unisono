[package]
name = "tuner-audio"
description = "Microphone capture: AudioSource trait, cpal (desktop) / oboe (Android), rtrb ring buffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rtrb = "0.3"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
tuner-core = { path = "../tuner-core" }

# cpal не собирается под Android; там будет oboe (этап 5, 7.1.2).
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
oboe = "0.6.1"

# TCC-статус микрофона через AVFoundation: cpal/CoreAudio при отказе
# отдаёт тишину вместо ошибки (7.2.1), спрашиваем явно.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[dev-dependencies]
serde_json = "1"
