name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.check.outputs.rust }}
      ui: ${{ steps.check.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f ui/package.json ]; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; fi

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy, rustfmt"
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm --prefix ui run check --if-present
      - run: npm --prefix ui run test
      - run: npm --prefix ui run build

  desktop:
    needs: [detect, rust, ui]
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.ui == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --prefix ui && npm ci
      - run: npm run tauri build -- --target aarch64-apple-darwin
      - run: npm run tauri build -- --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    needs: [detect, rust, ui]
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui && npm ci
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe

  linux:
    needs: [detect, rust, ui]
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf rpm
      - run: npm ci --prefix ui && npm ci
      - name: Build Linux bundles (.deb, .rpm, .AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npm run tauri build -- --bundles deb,rpm,appimage
      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          mkdir -p packaging/arch/out && chmod 777 packaging/arch/out
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v "$PWD/packaging/arch/out:/out" \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed base-devel zstd
              useradd -m builder
              mkdir -p /tmp/work/packaging /tmp/work/target/release /tmp/work/brand
              cp -a /work/packaging/arch /tmp/work/packaging/arch
              cp /work/target/release/app /tmp/work/target/release/app
              cp -a /work/brand/png /tmp/work/brand/png
              cp /work/LICENSE /tmp/work/LICENSE
              chown -R builder:builder /tmp/work
              su - builder -c "cd /tmp/work/packaging/arch && PKGDEST=/out makepkg -d --noconfirm"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            packaging/arch/out/*.pkg.tar.zst

  android:
    needs: [detect, rust, ui]
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.ui == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125"
      - run: npm ci --prefix ui && npm ci
      - name: Build Android APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          npm run tauri android build -- --apk --target aarch64 --target armv7 --debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [desktop, windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
      - name: Flatten release assets & generate SHA256SUMS
        run: |
          mkdir -p release-assets
          find dist-release -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.pkg.tar.zst' -o -name '*.apk' \) -exec cp -v {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes
          fi
